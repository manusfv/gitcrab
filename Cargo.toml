[package]
name = "gitcrab"
version = "0.1.0"
edition = "2021"
description = "An independent Git desktop client with a lane-based history graph"
license = "MIT"

[lib]
name = "gitcrab_core"

[[bin]]
name = "gitcrab"
path = "src/desktop.rs"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
ts-rs = "12"
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2", optional = true }
rfd = { version = "0.15", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[profile.release]
lto = "thin"
