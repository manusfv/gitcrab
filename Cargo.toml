[package]
name = "gitcrab"
version = "0.1.0"
edition = "2021"
description = "An independent Git desktop client with a lane-based history graph"
license = "MIT"
default-run = "gitcrab"

[lib]
name = "gitcrab_core"

[features]
default = ["gpui-desktop"]
gpui-desktop = ["dep:gpui", "dep:gpui-component", "dep:serde_json", "dep:notify", "dep:async-channel", "dep:embed-resource"]
native-evidence = ["gpui-desktop", "git-trace"]
# Records every Git process with its timing. Diagnostic builds only.
git-trace = []

[[bin]]
name = "gitcrab"
path = "src/native/main.rs"
required-features = ["gpui-desktop"]

# Headless latency benchmark of the controller and Git worker:
# cargo run --release --no-default-features --features git-trace --example latency -- --help
[[example]]
name = "latency"
required-features = ["git-trace"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }

gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", optional = true, default-features = false }
serde_json = { version = "1", optional = true }
notify = { version = "=7.0.0", optional = true }
async-channel = { version = "=2.5.0", optional = true }

[dev-dependencies]
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = { version = "3.0.12", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_ProcessStatus"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"

[patch.crates-io]
# Shared pointer behavior also covers library-owned dialog and menu controls.
gpui-component = { path = "vendor/gpui-component" }
# gpui -> zed-async-tar -> xattr 0.2.3 uses a removed libc Linux alias.
xattr = { path = "vendor/xattr" }
