[package]
name = "gitcrab"
version = "0.1.0"
edition = "2021"
description = "An independent Git desktop client with a lane-based history graph"
license = "MIT"
default-run = "gitcrab"

[lib]
name = "gitcrab_core"

[[example]]
name = "benchmark"
path = "scripts/benchmark.rs"

[features]
default = ["gpui-desktop"]
gpui-desktop = ["dep:gpui", "dep:gpui-component", "dep:anyhow", "dep:serde_json", "dep:notify", "dep:async-channel"]
native-evidence = ["gpui-desktop", "dep:serde_json"]
[[bin]]
name = "gitcrab"
path = "src/native/main.rs"
required-features = ["gpui-desktop"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }

gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", optional = true, default-features = false }
anyhow = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
notify = { version = "=7.0.0", optional = true }
async-channel = { version = "=2.5.0", optional = true }

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = "thin"

[patch.crates-io]
# Shared pointer behavior also covers library-owned dialog and menu controls.
gpui-component = { path = "vendor/gpui-component" }
# gpui -> zed-async-tar -> xattr 0.2.3 uses a removed libc Linux alias.
xattr = { path = "vendor/xattr" }


[[example]]
name = "accessibility-probe"
path = "scripts/accessibility-probe.rs"
required-features = ["gpui-desktop"]
