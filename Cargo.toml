[workspace]
resolver = "2"
members = ["crates/core", "crates/git", "crates/settings", "crates/ui", "crates/app"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gitcrab-core = { path = "crates/core" }
gitcrab-git = { path = "crates/git" }
gitcrab-settings = { path = "crates/settings" }
gitcrab-ui = { path = "crates/ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

# GPUI Kit pins the matching gpui-pre renderer and gpui-component library.
# Imported as `gpui`; the components are under `gpui::component`.
gpui = { package = "gpui-kit", version = "=0.9.1", default-features = false, features = ["component"] }
notify = "=7.0.0"
async-channel = "=2.5.0"

[profile.release]
lto = "thin"
