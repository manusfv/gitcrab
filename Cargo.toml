[workspace]
resolver = "2"
members = ["crates/core", "crates/git", "crates/settings", "crates/ui", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
gitcrab-core = { path = "crates/core" }
gitcrab-git = { path = "crates/git" }
gitcrab-settings = { path = "crates/settings" }
gitcrab-ui = { path = "crates/ui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

gpui = "=0.2.2"
gpui-component = { version = "=0.5.1", default-features = false }
notify = "=7.0.0"
async-channel = "=2.5.0"

[profile.release]
lto = "thin"

[patch.crates-io]
# Shared pointer behavior also covers library-owned dialog and menu controls.
gpui-component = { path = "vendor/gpui-component" }
# gpui -> zed-async-tar -> xattr 0.2.3 uses a removed libc Linux alias.
xattr = { path = "vendor/xattr" }
