[package]
name = "gitcrab"
version = "0.1.0"
edition = "2021"
description = "An independent native Git desktop client with a lane-based history graph"
license = "MIT"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
