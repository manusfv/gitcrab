[graph]
all-features = true

[advisories]
unmaintained = "all"
unsound = "all"
# Review by 2027-02-10.
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "Transitive GPUI dependency. Coordinated GPUI upgrade pending." },
    { id = "RUSTSEC-2026-0173", reason = "Build-time macro dependency. Coordinated GPUI upgrade pending." },
    { id = "RUSTSEC-2024-0384", reason = "GPUI executor and notify timer dependencies." },
    { id = "RUSTSEC-2024-0436", reason = "Build-time paste macro in the renderer, components and codecs." },
    { id = "RUSTSEC-2026-0441", reason = "Transitive through GPUI's async-std dependency." },
    { id = "RUSTSEC-2025-0134", reason = "PEM parsing through GPUI's zed-reqwest client." },
    { id = "RUSTSEC-2026-0206", reason = "Text and SVG shaping through GPUI." },
    { id = "RUSTSEC-2026-0192", reason = "Font parsing through GPUI text and SVG dependencies." },
    { id = "RUSTSEC-2024-0449", reason = "Component translation processing through rust-i18n." },
    { id = "RUSTSEC-2026-0371", reason = "Linux D-Bus runtime through ashpd and oo7." },
    { id = "RUSTSEC-2026-0370", reason = "Linux D-Bus runtime through ashpd and oo7." },
    { id = "RUSTSEC-2026-0372", reason = "Build-time derive macro for Linux D-Bus dependencies." },
]

[licenses]
include-build = true
allow = [
    "0BSD", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
    "BSD-3-Clause", "BSL-1.0", "CC0-1.0", "ISC", "MIT", "MPL-2.0",
    "Unicode-3.0", "Unlicense", "Zlib",
]
exceptions = [{ crate = "libfuzzer-sys@0.4.13", allow = ["NCSA"] }]
