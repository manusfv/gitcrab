name: Checks

# Pull requests into dev run the quick checks on Windows and Linux.
# Pull requests from dev into main also run macOS and the release build.
on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      rust_version:
        description: Rust candidate to qualify before updating the maintainer pin
        default: "1.99.1"
        type: string

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only dev may merge into main. This job also picks the target matrix.
  policy:
    name: branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.plan.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          full=false
          if [[ "$EVENT" == workflow_dispatch ]]; then
            full=true
          elif [[ "$BASE" == main ]]; then
            if [[ "$HEAD" != dev || "$HEAD_REPO" != "$REPO" ]]; then
              echo "::error::Only the dev branch of this repository may open pull requests into main."
              exit 1
            fi
            full=true
          fi
          windows='{"runner":"windows-2025","target":"x86_64-pc-windows-msvc"}'
          linux='{"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"}'
          mac_arm='{"runner":"macos-15","target":"aarch64-apple-darwin"}'
          mac_intel='{"runner":"macos-15-intel","target":"x86_64-apple-darwin"}'
          if [[ "$full" == true ]]; then
            matrix="[$windows,$linux,$mac_arm,$mac_intel]"
          else
            matrix="[$windows,$linux]"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUST_VERSION: ${{ inputs.rust_version || '1.99.1' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          echo "RUSTUP_TOOLCHAIN=$RUST_VERSION" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check

  native:
    name: ${{ matrix.target }}
    needs: policy
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.policy.outputs.matrix) }}
    env:
      FULL_BUILD: ${{ needs.policy.outputs.full }}
      RUST_VERSION: ${{ inputs.rust_version || '1.99.1' }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev libasound2-dev \
            libudev-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-xkb-dev libx11-xcb-dev libvulkan-dev mesa-vulkan-drivers \
            xvfb dbus-x11 openbox xdotool
      - name: Locate Windows SDK shader compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $fxc = Get-ChildItem "$sdk/*/x64/fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$fxc) { throw "Windows SDK fxc.exe missing under $sdk" }
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Check Metal toolchain
        if: runner.os == 'macOS'
        run: xcrun --find metal
      - name: Install Rust
        shell: pwsh
        run: |
          rustup toolchain install "${env:RUST_VERSION}-${{ matrix.target }}" --profile minimal --component clippy
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=${env:RUST_VERSION}-${{ matrix.target }}" >> $env:GITHUB_ENV
          git --version
      - name: Crate boundaries
        # Core stays free of UI and I/O; the UI reaches I/O only through core's traits.
        # The core tests run in the next step.
        shell: bash
        run: scripts/check-boundaries.sh --skip-tests
      - name: Verify clean checkout
        shell: pwsh
        run: |
          if (git status --porcelain) { throw "Expected a clean checkout" }
          New-Item -ItemType Directory -Path check-logs
          function Check($name, [string[]]$arguments) {
            cargo @arguments 2>&1 | Tee-Object "check-logs/$name.log"
            if ($LASTEXITCODE) { throw "$name failed with exit code $LASTEXITCODE" }
          }
          # Lint per target: much of the platform code sits behind cfg(windows)/cfg(unix).
          # `-D warnings` applies to GitCrab only, not its dependencies.
          Check clippy-core @('clippy', '--locked', '-p', 'gitcrab-core', '--lib', '--tests', '--', '-D', 'warnings')
          Check clippy-native @('clippy', '--locked', '--workspace', '--all-features', '--all-targets', '--', '-D', 'warnings')
          Check core @('test', '--locked', '-p', 'gitcrab-core')
          Check native @('test', '--locked', '--workspace', '--all-features', '--exclude', 'gitcrab-core')
      - name: Release build
        if: env.FULL_BUILD == 'true'
        shell: pwsh
        run: |
          $env:GITCRAB_BUILD_REVISION = git rev-parse HEAD
          if ($LASTEXITCODE -or $env:GITCRAB_BUILD_REVISION -ne $env:GITHUB_SHA) {
            throw 'Checked-out revision differs from the CI revision'
          }
          cargo build --locked --release --bin gitcrab 2>&1 | Tee-Object check-logs/release.log
          if ($LASTEXITCODE) { throw "release failed with exit code $LASTEXITCODE" }
      - name: Linux renderer smoke
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --features native-evidence --bin gitcrab
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a dbus-run-session -- bash -c 'openbox & python3 tests/smoke-x11.py target/debug/gitcrab check-logs/renderer'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: checks-${{ matrix.target }}
          path: check-logs/
          if-no-files-found: ignore
          retention-days: 14
