name: Dependencies

on:
  pull_request:
    paths: [Cargo.toml, Cargo.lock, deny.toml, 'vendor/**', scripts/verify-vendor.py, .github/workflows/dependencies.yml]
  push:
    branches: [main]
    paths: [Cargo.toml, Cargo.lock, deny.toml, 'vendor/**', scripts/verify-vendor.py, .github/workflows/dependencies.yml]
  schedule:
    - cron: '30 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 scripts/verify-vendor.py
      - name: Enforce advisory exception review date
        run: |
          if [[ "$(date -u +%F)" > 2027-02-10 ]]; then
            echo 'The GitCrab RustSec exceptions need review.'
            exit 1
          fi
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 install --locked cargo-deny --version 0.20.2
      - run: cargo +1.99.1 deny --locked check advisories licenses
