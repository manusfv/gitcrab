name: GPUI native
on:
  push:
    branches: [feat/gpui-migration]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gpui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Windows x64, runner: windows-2025, package: windows-x64}
          - {name: Linux x64, runner: ubuntu-24.04, package: linux-x64}
          - {name: macOS ARM64, runner: macos-15, package: macos-arm64}
          - {name: macOS Intel, runner: macos-15-intel, package: macos-x64}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.package }}
          cache-on-failure: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev libasound2-dev libudev-dev libfontconfig1-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libxcb-xkb-dev libx11-xcb-dev libvulkan-dev mesa-vulkan-drivers xvfb dbus-x11 scrot openbox
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --no-default-features --lib
      - run: cargo build --locked --release --bin gitcrab-gpui
      - name: Package production binary
        shell: pwsh
        run: ./scripts/package-gpui.ps1 -Name '${{ matrix.package }}'
      - name: Build isolated renderer evidence executable
        run: cargo build --locked --release --features native-evidence --bin gitcrab-gpui
      - name: Exercise Linux X11 renderer
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash -c 'openbox & pwsh -File scripts/smoke-gpui.ps1 -Executable "$PWD/target/release/gitcrab-gpui"'
      - name: Exercise native renderer
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'target/release/gitcrab-gpui.exe' } else { 'target/release/gitcrab-gpui' }
          ./scripts/smoke-gpui.ps1 -Executable (Join-Path $PWD $exe)
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: gpui-${{ matrix.package }}
          path: |
            dist/gpui-packages/*
            dist/gpui-smoke/*
          if-no-files-found: error
          retention-days: 14
