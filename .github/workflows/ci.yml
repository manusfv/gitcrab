name: Tauri desktop
on:
  push:
    branches: [main]
    paths:
      [
        "src/**",
        "frontend/**",
        "icons/**",
        "Cargo.*",
        "build.rs",
        "package*.json",
        "*config*",
        "index.html",
        ".github/workflows/**",
        "scripts/**",
      ]
  pull_request:
    paths:
      [
        "src/**",
        "frontend/**",
        "icons/**",
        "Cargo.*",
        "build.rs",
        "package*.json",
        "*config*",
        "index.html",
        ".github/workflows/**",
        "scripts/**",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: Linux x64,
              runner: ubuntu-24.04,
              package: gitcrab-linux-x64,
              bundles: deb,
            }
          - {
              name: macOS Apple Silicon,
              runner: macos-15,
              package: gitcrab-macos-arm64,
              bundles: app,
            }
          - {
              name: macOS Intel,
              runner: macos-15-intel,
              package: gitcrab-macos-x64,
              bundles: app,
            }
          - {
              name: Windows x64,
              runner: windows-2025,
              package: gitcrab-windows-x64,
              bundles: nsis,
            }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Ensure Windows WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Get-ChildItem -Path "${env:ProgramFiles(x86)}/Microsoft/EdgeWebView/Application/*/msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (-not $runtime) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile "$env:RUNNER_TEMP/WebView2Setup.exe"
            $installer = Start-Process -FilePath "$env:RUNNER_TEMP/WebView2Setup.exe" -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            if ($installer.ExitCode -ne 0) { throw "WebView2 install failed: $($installer.ExitCode)" }
          }
      - name: Install Linux WebKit prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb dbus-x11 at-spi2-core
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --lib
      - run: npm test
      - run: npm run build
      - name: Build native renderer test app
        run: cargo build --locked --features desktop,custom-protocol,native-smoke
      - name: Exercise native Linux WebKit renderer
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a dbus-run-session -- node scripts/webdriver-smoke.mjs target/debug/gitcrab dist/native-smoke
      - name: Exercise native macOS renderer
        if: runner.os == 'macOS'
        run: node scripts/webdriver-smoke.mjs target/debug/gitcrab dist/native-smoke
      - name: Exercise native Windows renderer
        if: runner.os == 'Windows'
        run: node scripts/webdriver-smoke.mjs target/debug/gitcrab.exe dist/native-smoke
      - name: Build native Tauri development package
        shell: pwsh
        run: ./scripts/package.ps1 -Name '${{ matrix.package }}' -Bundles '${{ matrix.bundles }}'
      - name: Exercise actual Windows WebView workflows
        if: runner.os == 'Windows'
        run: node scripts/native-e2e.mjs target/release/gitcrab.exe dist/native-e2e
      - name: Upload development package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.package }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload workflow captures
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.package }}-webview-captures
          path: |
            dist/native-e2e/*.png
            dist/native-e2e/result.json
            dist/native-smoke/*.png
            dist/native-smoke/result.json
          if-no-files-found: ignore
          retention-days: 14
