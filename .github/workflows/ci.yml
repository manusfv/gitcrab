name: Native platforms

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            package: gitcrab-linux-x64
          - name: macOS Apple Silicon
            runner: macos-15
            package: gitcrab-macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            package: gitcrab-macos-x64
          - name: Windows x64
            runner: windows-2025
            package: gitcrab-windows-x64
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux display and build libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libudev-dev libgl1-mesa-dev libegl1-mesa-dev xvfb xauth fonts-dejavu-core
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test native Git and graph behavior
        run: cargo test --locked
      - name: Build native desktop binary
        run: cargo build --locked --release
      - name: Smoke-test Linux native renderer
        if: runner.os == 'Linux'
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WINIT_UNIX_BACKEND: x11
        run: xvfb-run -a -s '-screen 0 1280x900x24' pwsh -File scripts/smoke-test.ps1 -Binary target/release/gitcrab -OutputDirectory dist/screenshots
      - name: Smoke-test macOS native renderer
        if: runner.os == 'macOS'
        run: ./scripts/smoke-test.ps1 -Binary target/release/gitcrab -OutputDirectory dist/screenshots
      - name: Package native application
        run: |
          $binary = if ($IsWindows) { 'target/release/gitcrab.exe' } else { 'target/release/gitcrab' }
          ./scripts/package.ps1 -Binary $binary -Name '${{ matrix.package }}'
      - name: Upload native package and checksum
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.package }}.zip
            dist/${{ matrix.package }}.tar.gz
            dist/${{ matrix.package }}.*.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload native renderer screenshots
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.package }}-screenshots
          path: dist/screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
