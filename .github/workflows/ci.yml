name: Tauri desktop
on:
  push:
    branches: [main]
    paths:
      [
        "src/**",
        "frontend/**",
        "icons/**",
        "Cargo.*",
        "build.rs",
        "package*.json",
        "*config*",
        "index.html",
        ".github/workflows/**",
        "scripts/**",
      ]
  pull_request:
    paths:
      [
        "src/**",
        "frontend/**",
        "icons/**",
        "Cargo.*",
        "build.rs",
        "package*.json",
        "*config*",
        "index.html",
        ".github/workflows/**",
        "scripts/**",
      ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: Linux x64,
              runner: ubuntu-24.04,
              package: gitcrab-linux-x64,
              bundles: deb,
            }
          - {
              name: macOS Apple Silicon,
              runner: macos-15,
              package: gitcrab-macos-arm64,
              bundles: app,
            }
          - {
              name: macOS Intel,
              runner: macos-15-intel,
              package: gitcrab-macos-x64,
              bundles: app,
            }
          - {
              name: Windows x64,
              runner: windows-2025,
              package: gitcrab-windows-x64,
              bundles: nsis,
            }
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux WebKit prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --lib
      - run: npm test
      - run: npm run build
      - name: Build native Tauri development package
        run: npm run tauri -- build --ci --bundles ${{ matrix.bundles }} -- --locked
      - name: Exercise actual Windows WebView workflows
        if: runner.os == 'Windows'
        run: node scripts/native-e2e.mjs target/release/gitcrab.exe dist/native-e2e
      - name: Upload development package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.package }}
          path: |
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.app/**
          if-no-files-found: error
          retention-days: 14
      - name: Upload workflow captures
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-webview-captures
          path: |
            dist/native-e2e/*.png
            dist/native-e2e/result.json
          if-no-files-found: ignore
          retention-days: 14
