[package]
name = "gitcrab-update"
description = "GitCrab's updates: reads the release manifests, verifies and installs update bundles behind gitcrab-core's Updater."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gitcrab_update"

[dependencies]
gitcrab-core.workspace = true
tokio.workspace = true
cargo-packager-updater.workspace = true

[dev-dependencies]
# Signs test bundles with a key pair generated in each test.
minisign = "0.7.9"
base64 = "0.22"
