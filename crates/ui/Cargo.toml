[package]
name = "gitcrab-ui"
description = "GitCrab's GPUI views and components."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "gitcrab_ui"

[features]
# Diagnostic capture: frame timings and Git process records.
native-evidence = []

[dependencies]
gitcrab-core.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui.workspace = true
notify.workspace = true
async-channel.workspace = true

[dev-dependencies]
# Must match the gpui-pre version gpui-kit pins.
gpui-test-support = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
